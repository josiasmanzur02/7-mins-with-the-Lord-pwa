    <div class="shell">
      <header class="topbar">

      <main>






<div class="card timer-card">
  <div class="timer-hero">
    <p class="muted">Focused time</p>
    <h1 class="title step-title">Calling on the Lord</h1>
    <div class="timer-display">00:30</div>
    <div class="verse-primary muted"></div>
    <div class="controls timer-controls">
      <button id="pause-btn" class="primary">Start</button>
      <button id="back-btn" class="ghost">Back</button>
      <button id="exit-btn" class="ghost danger-ghost">Exit</button>
    </div>
    <p class="muted" id="status" hidden></p>
  </div>

  <div class="timer-details">
    <button id="toggle-steps" class="ghost expand-btn">Show steps ↓</button>
    <div id="steps-panel" class="steps-panel">
      <div class="progress-box" style="margin-bottom: 10px;">
        <div>Progress</div>
        <div class="progress-text">1 / 7</div>
      </div>
      <ul class="step-list">
        
          <li class="step-row">
            <span>Calling on the Lord</span>
            <span class="muted">30s</span>
          </li>
        
          <li class="step-row">
            <span>Pray</span>
            <span class="muted">60s</span>
          </li>
        
          <li class="step-row">
            <span>Pray-Read</span>
            <span class="muted">150s</span>
          </li>
        
          <li class="step-row">
            <span>Confession</span>
            <span class="muted">60s</span>
          </li>
        
          <li class="step-row">
            <span>Consecration</span>
            <span class="muted">30s</span>
          </li>
        
          <li class="step-row">
            <span>Give Thanks</span>
            <span class="muted">30s</span>
          </li>
        
          <li class="step-row">
            <span>Petition</span>
            <span class="muted">60s</span>
          </li>
        
      </ul>
    </div>
  </div>

  <div id="wait-overlay" class="wait-overlay" hidden aria-hidden="true">
    <div
      class="wait-overlay-panel"
      role="dialog"
      aria-modal="true"
      aria-label="Waiting timer"
    >
      <div class="wait-overlay-timer">00:10</div>
    </div>
  </div>
</div>
